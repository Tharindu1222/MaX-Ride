name: driver_app
description: MaX Ride driver app — Sri Lanka (LKR)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  geolocator: ^13.0.2
  device_info_plus: ^11.5.0
  socket_io_client: ^3.0.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.1
  google_maps_flutter_android: ^2.14.0
  google_maps_flutter_platform_interface: ^2.9.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/driver_cabin_welcome.png
    - assets/images/driver_hero_car.png
    - assets/images/driver_hero_car_tight.png
